name: api-usuarios-clean-tests

services:
  postgres:
    image: postgres:18
    restart: "no"
    environment:
      POSTGRES_DB: usuarios_test
      POSTGRES_USER: usuarios_test_admin
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:?Definir contraseña independiente en .env.test}
    ports:
      - "127.0.0.1:5435:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - pruebas

networks:
  pruebas:
    driver: bridge
